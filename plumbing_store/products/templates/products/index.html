<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
         <title>Титульная страница проекта</title>
    <style>
        /* ===== СБРОС СТИЛЕЙ ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ===== ОСНОВНЫЕ НАСТРОЙКИ ===== */
        html, body {
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        /* ===== ОБЕРТКА (flex-контейнер) ===== */
        .wrapper {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ===== НАВИГАЦИОННОЕ МЕНЮ (сверху) ===== */
        .navbar {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 50px;
            display: flex;
            justify-content: center;
            gap: 20px;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.15);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .navbar a {
            color: #2c3e50;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            padding: 10px 25px;
            border-radius: 25px;
            transition: all 0.3s ease;
        }

        .navbar a:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .navbar a.active {
            background: #667eea;
            color: white;
        }

        /* ===== ОСНОВНОЙ КОНТЕНТ ===== */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        /* ===== КОНТЕЙНЕР С ТИТУЛЬНОЙ ИНФОРМАЦИЕЙ ===== */
        .content-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 60px 80px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 800px;
            width: 100%;
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .content-box h1 {
            font-size: 52px;
            color: #2c3e50;
            margin-bottom: 15px;
            letter-spacing: -1px;
        }

        .content-box h1 span {
            color: #667eea;
        }

        .content-box .subtitle {
            font-size: 22px;
            color: #555;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .content-box .info {
            font-size: 18px;
            color: #777;
            margin: 8px 0;
            line-height: 1.6;
        }

        .content-box .divider {
            width: 60px;
            height: 3px;
            background: #667eea;
            margin: 20px auto;
            border-radius: 2px;
        }

        .content-box .year {
            font-size: 16px;
            color: #999;
            margin-top: 15px;
        }

        /* ===== ПОДВАЛ ===== */
        .footer {
            background: #2c3e50;
            color: white;
            padding: 25px 50px;
            text-align: center;
            border-top: 4px solid #667eea;
        }

        .footer p {
            color: #b0b0b0;
            margin: 5px 0;
            font-size: 14px;
        }

        .footer .footer-links {
            margin-bottom: 10px;
        }

        .footer .footer-links a {
            color: #b0b0b0;
            text-decoration: none;
            margin: 0 15px;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .footer .footer-links a:hover {
            color: #667eea;
        }

        .footer .heart {
            color: #e74c3c;
        }

        /* ===== АДАПТИВНОСТЬ ===== */
        @media (max-width: 768px) {
            .navbar {
                padding: 12px 20px;
                gap: 10px;
                flex-wrap: wrap;
            }

            .navbar a {
                font-size: 14px;
                padding: 8px 15px;
            }

            .content-box {
                padding: 40px 30px;
            }

            .content-box h1 {
                font-size: 36px;
            }

            .content-box .subtitle {
                font-size: 18px;
            }

            .footer {
                padding: 20px;
            }

            .footer .footer-links a {
                margin: 0 10px;
                font-size: 13px;
            }
        }

        @media (max-width: 480px) {
            .navbar {
                flex-direction: column;
                align-items: center;
                gap: 5px;
            }

            .navbar a {
                width: 100%;
                text-align: center;
                padding: 10px;
            }

            .content-box {
                padding: 30px 20px;
            }

            .content-box h1 {
                font-size: 28px;
            }

            .footer .footer-links {
                display: flex;
                flex-direction: column;
                gap: 5px;
            }

            .footer .footer-links a {
                margin: 0;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">

        <!-- ===== НАВИГАЦИОННОЕ МЕНЮ ===== -->
        <nav class="navbar">
            <a href="#" class="active">Главная</a>
            <a href="#">О проекте</a>
            <a href="http://127.0.0.1:8000/products">Оборудование</a>
            <a href="#">Избранное</a>
            <a href="#">Корзина</a>
            <a href="#">Просмотренное</a>
            <a href="#">Рассчитать срок службы</a>
        </nav>

        <!-- ===== ОСНОВНОЙ КОНТЕНТ ===== -->
        <div class="main-content">
            <div class="content-box">
                <h1>Водная <span>планета</span></h1>
                <div class="divider"></div>
                <p class="subtitle">Магазин сантехники</p>
                <p class="info"><strong>Всё для тепла и комфорта</p>
            </div>
        </div>

        <!-- ===== ПОДВАЛ ===== -->
        <footer class="footer">
            <div class="footer-links">
                <a href="#">Главная</a>
                <a href="#">О магазине</a>
                <a href="#">Контакты</a>
                <a href="#">Политика конфиденциальности</a>
            </div>
            <p>&copy; Все права защищены.</p>
            <p>Сделано для магазина Водная планета</p>
        </footer>

    </div>

</body>
</html>
