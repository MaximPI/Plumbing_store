<!DOCTYPE html>
{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказ создан</title>
    <link href="{% static 'css/modal.css' %}" rel="stylesheet">
</head>
<body>

    <div class="modal-box">
        <a href="{% url 'products:orders' %}" class="modal-close" aria-label="Закрыть">✕</a>

        <div class="modal-icon">✅</div>
        <h2 class="modal-title">Заказ успешно создан!</h2>
        <p class="modal-message">
            Спасибо за покупку. Мы отправили детали заказа на вашу почту.
            Наш менеджер свяжется с вами в ближайшее время.
        </p>
    </div>

</body>
</html>
